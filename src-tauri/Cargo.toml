[package]
name = "tpt-finder"
version = "1.0.0"
description = "Instant file search with optional semantic understanding"
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-finder"

[lib]
name = "tpt_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tpt-finder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
trash = "5"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
pdf-extract = "0.7"
zip = "2"
quick-xml = "0.36"
encoding_rs = "0.8"
ureq = { version = "2", features = ["json"] }
tpt-archon-relational = { version = "0.1", optional = true }

[features]
default = []
# Phase 6: Archon SQL backend adapter (tpt-archon embed).
archon = ["dep:tpt-archon-relational"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Faster local `cargo check` / clippy on the engine while iterating.
[profile.dev.package."*"]
opt-level = 1
